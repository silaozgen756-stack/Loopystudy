// ── Hopping Rabbit (screen crosser) ──────────────────────────────────────────
const HoppingRabbit = () => {
  const [vis,    setVis]   = useState(false);
  const [posX,   setPosX]  = useState(-70);
  const [bottom, setBot]   = useState(94);
  const [flipX,  setFlipX] = useState(false);
  const [jumpY,  setJumpY] = useState(0);
  const rafRef  = useRef(null);
  const hopRef  = useRef(null);
  const nextRef = useRef(null);
  const alive   = useRef(true);

  useEffect(() => {
    alive.current = true;
    const schedule = (ms) => { nextRef.current = setTimeout(startRun, ms); };
    const startRun = () => {
      if (!alive.current) return;
      const W     = window.innerWidth;
      const right = Math.random() > 0.5;
      const sx    = right ? -70 : W + 70;
      const ex    = right ? W + 70 : -70;
      const bot   = 94 + Math.floor(Math.random() * 20);
      const dur   = 3000 + Math.random() * 1400;
      const t0    = Date.now();
      setVis(true); setPosX(sx); setBot(bot); setFlipX(!right);
      let up = true;
      const doHop = () => {
        if (!alive.current) return;
        setJumpY(up ? -26 : 0);
        up = !up;
        hopRef.current = setTimeout(doHop, up ? 340 : 180);
      };
      doHop();
      const move = () => {
        if (!alive.current) return;
        const p = Math.min((Date.now() - t0) / dur, 1);
        setPosX(sx + (ex - sx) * p);
        if (p < 1) { rafRef.current = requestAnimationFrame(move); }
        else {
          clearTimeout(hopRef.current);
          setJumpY(0); setVis(false);
          schedule(5000 + Math.random() * 7000);
        }
      };
      rafRef.current = requestAnimationFrame(move);
    };
    schedule(2000 + Math.random() * 2000);
    return () => {
      alive.current = false;
      cancelAnimationFrame(rafRef.current);
      clearTimeout(hopRef.current);
      clearTimeout(nextRef.current);
    };
  }, []);

  if (!vis) return null;
  const c = "#c8a96e";
  return ReactDOM.createPortal(
    <div style={{
      position:"fixed", left:posX, bottom:bottom,
      zIndex:9998, pointerEvents:"none",
      transform:`scaleX(${flipX?-1:1})`,
      transformOrigin:"26px 66px",
    }}>
      <div style={{
        transform:`translateY(${jumpY}px)`,
        transition: jumpY < 0
          ? "transform 0.14s cubic-bezier(.34,2.2,.64,1)"
          : "transform 0.20s cubic-bezier(.22,.6,.36,1)",
      }}>
        <svg width="52" height="66" viewBox="0 0 80 100" fill="none">
          <ellipse cx="28" cy="22" rx="9" ry="20" fill={c} stroke="#a07840" strokeWidth="1.5"/>
          <ellipse cx="28" cy="22" rx="4" ry="14" fill="#c4867a" opacity=".6"/>
          <ellipse cx="52" cy="22" rx="9" ry="20" fill={c} stroke="#a07840" strokeWidth="1.5"/>
          <ellipse cx="52" cy="22" rx="4" ry="14" fill="#c4867a" opacity=".6"/>
          <ellipse cx="40" cy="48" rx="22" ry="20" fill={c} stroke="#a07840" strokeWidth="1.5"/>
          <circle cx="33" cy="45" r="4" fill="#2a1a0e"/>
          <circle cx="47" cy="45" r="4" fill="#2a1a0e"/>
          <circle cx="34.5" cy="43.5" r="1.5" fill="white"/>
          <circle cx="48.5" cy="43.5" r="1.5" fill="white"/>
          <ellipse cx="40" cy="52" rx="3.5" ry="2.5" fill="#b8706a"/>
          <path d="M36 56 Q40 60 44 56" stroke="#a07840" strokeWidth="1.5" strokeLinecap="round" fill="none"/>
          <ellipse cx="30" cy="54" rx="6" ry="3" fill="#c4867a" opacity=".3"/>
          <ellipse cx="50" cy="54" rx="6" ry="3" fill="#c4867a" opacity=".3"/>
          <ellipse cx="40" cy="78" rx="20" ry="18" fill={c} stroke="#a07840" strokeWidth="1.5"/>
          <ellipse cx="26" cy="89" rx="8" ry="5" fill={c} stroke="#a07840" strokeWidth="1.2"/>
          <ellipse cx="54" cy="89" rx="8" ry="5" fill={c} stroke="#a07840" strokeWidth="1.2"/>
        </svg>
      </div>
    </div>,
    document.body
  );
}
// ── Confetti burst (canvas) ──────────────────────────────────────────────────
const Confetti = () => {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = window.innerWidth;
    const H = canvas.height = window.innerHeight;
    const colors = ['#f59e0b','#10b981','#fbbf24','#ef4444','#3b82f6','#c8a96e'];
    const pieces = Array.from({length:120}, () => ({
      x: Math.random()*W, y: -20 - Math.random()*H*0.3,
      r: 4+Math.random()*5, c: colors[Math.floor(Math.random()*colors.length)],
      vy: 2+Math.random()*3, vx: -1.5+Math.random()*3,
      rot: Math.random()*360, vr: -6+Math.random()*12,
    }));
    let raf, alive = true;
    const draw = () => {
      if (!alive) return;
      ctx.clearRect(0,0,W,H);
      pieces.forEach(p => {
        p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
        ctx.restore();
      });
      raf = requestAnimationFrame(draw);
    };
    draw();
    const timer = setTimeout(() => { alive=false; cancelAnimationFrame(raf); }, 3200);
    return () => { alive=false; cancelAnimationFrame(raf); clearTimeout(timer); };
  }, []);
  return ReactDOM.createPortal(
    <canvas ref={ref} style={{position:"fixed",inset:0,zIndex:9999,pointerEvents:"none"}}/>,
    document.body
  );
};

// ── Live Timer Pill ───────────────────────────────────────────────────────────
// Shows in header while a session is running and minimized
const LiveTimerPill = ({ subject, onReturn }) => {
  const [elapsed, setElapsed] = useState(0);

  useEffect(() => {
    const TIMER_KEY = "loopy_timer_" + subject.id;
    // Read startedAt from storage and tick
    let startedAt = null;
    const init = async () => {
      try {
        const _st2=_ls?localStorage.getItem(TIMER_KEY):(_mem[TIMER_KEY]||null);
        if(_st2){const d=JSON.parse(_st2);startedAt=d.startedAt;setElapsed(Math.floor((Date.now()-startedAt)/1000));}
      } catch {}
    };
    init();
    const id = setInterval(async () => {
      if (startedAt) {
        setElapsed(Math.floor((Date.now() - startedAt) / 1000));
      } else {
        // try again — storage might not have responded yet
        try {
          const _st3=_ls?localStorage.getItem("loopy_timer_"+subject.id):(_mem["loopy_timer_"+subject.id]||null);
          if(_st3){const d=JSON.parse(_st3);startedAt=d.startedAt;}
        } catch {}
      }
    }, 1000);
    return () => clearInterval(id);
  }, [subject.id]);

  const tc = tagColor(subject.tag);
  return (
    <button
      onClick={onReturn}
      style={{
        marginTop:10, width:"100%", padding:"10px 14px",
        background:"linear-gradient(135deg,rgba(59,130,246,.18),rgba(37,99,235,.1))",
        border:"2px solid rgba(59,130,246,.45)", borderRadius:12,
        display:"flex", alignItems:"center", gap:10,
        cursor:"pointer", animation:"fadeIn .3s ease",
        fontFamily:"'Baloo 2',cursive",
      }}
    >
      {/* Pulsing dot */}
      <span style={{width:8,height:8,borderRadius:"50%",background:"#3b82f6",boxShadow:"0 0 0 0 rgba(59,130,246,.5)",animation:"pingPulse 1.4s ease-in-out infinite",flexShrink:0,display:"inline-block"}}/>
      <span style={{fontSize:12,fontWeight:700,color:"#93c5fd",flex:1,textAlign:"left",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
        {subject.name}
      </span>
      <span style={{fontFamily:"'Baloo 2',cursive",fontWeight:800,fontSize:15,color:"#dbeafe",letterSpacing:1,flexShrink:0}}>
        {fmt(elapsed)}
      </span>
      <span style={{fontSize:11,color:"#60a5fa",flexShrink:0}}>↑ tap to return</span>
    </button>
  );
};

// ── Study Session ─────────────────────────────────────────────────────────────
const StudySession = ({ subject, onComplete, onCancel, onMinimize, onTick, t }) => {
  const [phase,setPhase]=useState("ready"); const [elapsed,setElapsed]=useState(0); const [running,setRunning]=useState(false); const [hopY,setHopY]=useState(0);
  const timerRef=useRef(null); const hopRef=useRef(null);
  // startedAt persists across navigation — we store wall-clock start time
  const startedAtRef=useRef(null); const baseElapsedRef=useRef(0);

  const TIMER_KEY = "loopy_timer_"+subject.id;

  // On mount: restore any saved timer from persistent storage (survives tab close)
  useEffect(()=>{
    (async()=>{
      try {
        const _st1=_ls?localStorage.getItem(TIMER_KEY):(_mem[TIMER_KEY]||null);
        if(_st1){const {startedAt,base}=JSON.parse(_st1);
          baseElapsedRef.current = base;
          startedAtRef.current = startedAt;
          const current = base + Math.floor((Date.now()-startedAt)/1000);
          setElapsed(current); setPhase("studying"); setRunning(true);
        }
      } catch {}
    })();
  },[]);

  useEffect(()=>{
    if(running){
      // Record wall-clock start time so elapsed survives any closure/reopening
      if(!startedAtRef.current) startedAtRef.current = Date.now()-baseElapsedRef.current*1000;
      {const _s=JSON.stringify({startedAt:startedAtRef.current,base:baseElapsedRef.current});_ls?localStorage.setItem(TIMER_KEY,_s):(_mem[TIMER_KEY]=_s);}
      timerRef.current=setInterval(()=>{
        const now=Math.floor((Date.now()-startedAtRef.current)/1000);
        setElapsed(now);
        if(onTick) onTick(now);
      },500);
    } else {
      clearInterval(timerRef.current);
      if(startedAtRef.current){
        baseElapsedRef.current=elapsed;
        startedAtRef.current=null;
        _ls?localStorage.removeItem(TIMER_KEY):(delete _mem[TIMER_KEY]);
      }
    }
    return()=>clearInterval(timerRef.current);
  },[running]);

  useEffect(()=>{ if(phase!=="studying"||!running){setHopY(0);clearTimeout(hopRef.current);return;} const doHop=()=>{setHopY(-30);setTimeout(()=>setHopY(0),200);hopRef.current=setTimeout(doHop,500);}; hopRef.current=setTimeout(doHop,300); return()=>clearTimeout(hopRef.current); },[phase,running]);
  const circ=2*Math.PI*54; const ringPct=Math.min((elapsed/3600)*100,100); const nextGap=subject.monthlyActive?30:(subject.stage>=INTERVALS.length-1?null:INTERVALS[subject.stage+1]);
  return (
    <div style={{minHeight:"100vh",background:"#0c0a09",color:"#fef3c7",fontFamily:"'Baloo 2',cursive",maxWidth:"var(--app-w,100%)",margin:"0 auto",display:"flex",flexDirection:"column",alignItems:"center",padding:"24px 20px 40px",animation:"fadeIn .25s ease"}}>
      <div style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <button onClick={onCancel} style={{background:"transparent",border:"1px solid #44403c",borderRadius:10,padding:"6px 14px",color:"#a8a29e",cursor:"pointer",fontFamily:"'Baloo 2',cursive",fontSize:13,fontWeight:700}}>{t.back}</button>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{padding:"4px 14px",borderRadius:99,background:`${tagColor(subject.tag)}22`,border:`1px solid ${tagColor(subject.tag)}55`,color:tagColor(subject.tag),fontFamily:"'Baloo 2',cursive",fontSize:12,fontWeight:700}}>{subject.tag}</div>
          {onMinimize && phase==="studying" && (
            <button onClick={onMinimize} title="Keep timer running, browse app" style={{background:"#1c1917",border:"1px solid #44403c",borderRadius:10,padding:"6px 10px",color:"#78716c",cursor:"pointer",fontSize:16,lineHeight:1}} onMouseEnter={e=>{e.currentTarget.style.borderColor="#f59e0b";e.currentTarget.style.color="#fbbf24";}} onMouseLeave={e=>{e.currentTarget.style.borderColor="#44403c";e.currentTarget.style.color="#78716c";}}>⬇</button>
          )}
        </div>
      </div>
      <div style={{textAlign:"center",width:"100%",marginBottom:14}}>
        <div style={{fontWeight:800,fontSize:24,color:"#fef3c7",lineHeight:1.2,marginBottom:10}}>{subject.name}</div>
        {subject.notes&&<div style={{padding:"12px 16px",background:"#1c1917",border:"1px solid #29252499",borderRadius:14,color:"#a8a29e",fontSize:13,fontFamily:"Georgia,serif",fontStyle:"italic",lineHeight:1.6,textAlign:"left"}}>{subject.notes}</div>}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
        <span style={{fontSize:12,color:"#57534e"}}>{t.reviewNum}{subject.stage+1}</span>
        <CarrotBar stage={subject.stage}/>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:4}}>
        <div style={{transform:`translateY(${hopY}px)`,transition:hopY<0?"transform 0.12s cubic-bezier(.34,2,.64,1)":"transform 0.22s cubic-bezier(.22,.6,.36,1)"}}>
          <Rabbit mood={phase==="done"?"happy":phase==="studying"?"focused":"idle"} size={88}/>
        </div>
        <div style={{width:110,height:6,background:"linear-gradient(90deg,#15803d,#16a34a,#15803d)",borderRadius:99,marginTop:4,opacity:.6}}/>
      </div>
      <div style={{position:"relative",margin:"20px 0"}}>
        <svg width={140} height={140} style={{transform:"rotate(-90deg)"}}>
          <circle cx="70" cy="70" r="54" fill="none" stroke="#292524" strokeWidth="8"/>
          <circle cx="70" cy="70" r="54" fill="none" stroke={phase==="done"?"#10b981":running?"#f59e0b":"#44403c"} strokeWidth="8" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={circ-(ringPct/100)*circ} style={{transition:"stroke-dashoffset .8s ease,stroke .3s"}}/>
        </svg>
        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div style={{fontWeight:800,fontSize:34,color:"#fef3c7",lineHeight:1}}>{fmt(elapsed)}</div>
          <div style={{fontSize:11,color:"#78716c",marginTop:3}}>{phase==="studying"?(running?"●●●":"⏸"):phase==="done"?"✓":"▶"}</div>
        </div>
      </div>
      <div style={{width:"100%",display:"flex",flexDirection:"column",gap:10}}>
        {phase==="ready"&&<button onClick={()=>{setPhase("studying");setRunning(true);}} style={{padding:"16px",background:"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",borderRadius:16,color:"#1c1917",fontFamily:"'Baloo 2',cursive",fontSize:18,fontWeight:800,cursor:"pointer"}}>{t.startStudying}</button>}
        {phase==="studying"&&<><button onClick={()=>setRunning(r=>!r)} style={{padding:"14px",background:running?"#1c1917":"linear-gradient(135deg,#3b82f6,#2563eb)",border:`2px solid ${running?"#44403c":"#3b82f6"}`,borderRadius:14,color:running?"#a8a29e":"white",fontFamily:"'Baloo 2',cursive",fontSize:16,fontWeight:700,cursor:"pointer"}}>{running?t.pause:t.resume}</button><button onClick={()=>{setRunning(false);setPhase("done");}} style={{padding:"14px",background:"linear-gradient(135deg,#10b981,#059669)",border:"none",borderRadius:14,color:"white",fontFamily:"'Baloo 2',cursive",fontSize:16,fontWeight:700,cursor:"pointer"}}>{t.markStudied}</button></>}
        {phase==="done"&&<button onClick={()=>onComplete(elapsed)} style={{padding:"16px",background:"linear-gradient(135deg,#10b981,#059669)",border:"none",borderRadius:16,color:"white",fontFamily:"'Baloo 2',cursive",fontSize:17,fontWeight:800,cursor:"pointer"}}>{nextGap!=null?<>{t.saveNext} {nextGap} {t.days}</>:"🎉 Save & Complete"}</button>}
      </div>
    </div>
  );
};

            {completed.map(s=><SubjectCard key={s.id} subject={s} onStudy={onStudy} onDelete={onDelete}/>)}
          </div>

      )}
    </div>
  );
};

// ── Garden Canvas Rabbits ─────────────────────────────────────────────────────
const RCOLS=["#c8a96e","#8db89a","#c8a96e","#fecaca","#e9d5ff"];
const GardenRabbitsCanvas = ({ width, height }) => {
  const canvasRef=useRef(null); const stateRef=useRef(null);
  useEffect(()=>{
    if(!width||!height)return;
    const canvas=canvasRef.current; if(!canvas)return;
    const ctx=canvas.getContext("2d");
    if(!stateRef.current){
      stateRef.current=RCOLS.map((color,i)=>({x:30+Math.random()*(width-60),y:60+Math.random()*(height-80),tx:30+Math.random()*(width-60),ty:60+Math.random()*(height-80),color,speed:0.5+Math.random()*0.4,flip:false,waitUntil:Date.now()+i*600}));
    }
    const rabbits=stateRef.current;
    const drawR=(ctx,x,y,hy,color,flip)=>{
      ctx.save(); ctx.translate(x,y+hy); const sc=0.3; ctx.scale(flip?-sc:sc,sc); ctx.translate(-40,-90);
      const E=(cx,cy,rx,ry,fill,str,sw=2,a=1)=>{ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.globalAlpha=a;ctx.fillStyle=fill;ctx.fill();if(str){ctx.strokeStyle=str;ctx.lineWidth=sw;ctx.stroke();}ctx.globalAlpha=1;};
      E(28,22,9,20,color,"#d97706"); E(28,22,4,14,"#c4867a",null,0,.7);
      E(52,22,9,20,color,"#d97706"); E(52,22,4,14,"#c4867a",null,0,.7);
      E(40,48,22,20,color,"#d97706"); E(40,80,20,18,color,"#d97706");
      E(33,45,4,4,"#1c1917"); E(47,45,4,4,"#1c1917");
      E(34.5,43.5,1.5,1.5,"white"); E(48.5,43.5,1.5,1.5,"white");
      E(40,52,3.5,2.5,"#b8706a"); E(26,90,8,5,color,"#d97706",1.5); E(54,90,8,5,color,"#d97706",1.5);
      ctx.restore();
    };
    let animId;
    const animate=()=>{
      ctx.clearRect(0,0,width,height);
      const now=Date.now();
      rabbits.forEach(r=>{
        if(now<r.waitUntil){drawR(ctx,r.x,r.y,0,r.color,r.flip);return;}
        const dx=r.tx-r.x,dy=r.ty-r.y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<2){r.waitUntil=now+500+Math.random()*1500;r.tx=30+Math.random()*(width-60);r.ty=60+Math.random()*(height-80);drawR(ctx,r.x,r.y,0,r.color,r.flip);return;}
        r.flip=dx<0; r.x+=(dx/dist)*r.speed; r.y+=(dy/dist)*r.speed;
        const hop=-Math.max(0,Math.sin(((now%420)/420)*Math.PI))*10;
        drawR(ctx,r.x,r.y,hop,r.color,r.flip);
      });
      animId=requestAnimationFrame(animate);
    };
    animate();
    return()=>cancelAnimationFrame(animId);
  },[width,height]);
  return <canvas ref={canvasRef} width={width} height={height} style={{position:"absolute",top:0,left:0,pointerEvents:"none"}}/>;
};

// ── Garden Tab ────────────────────────────────────────────────────────────────
// ── Carrot shape helper — tapered, realistic silhouette ─────────────────────
const carrotPath = (bw, h) => {
  const w = bw / 2;
  return `M ${-w} ${-h} C ${-w*1.2} ${-h*0.55} ${-w*0.3} ${-h*0.05} 0 4 C ${w*0.3} ${-h*0.05} ${w*1.2} ${-h*0.55} ${w} ${-h} Q 0 ${-h-bw*0.4} ${-w} ${-h} Z`;
};

const GardenTab = ({ subjects, onStudy, studying, liveElapsed, t }) => {
  const [tooltip,setTooltip]=useState(null);
  const [basketOpen,setBasketOpen]=useState(false);
  const [fullscreen,setFullscreen]=useState(false);
  const [dims,setDims]=useState({w:380});
  const [fsDims,setFsDims]=useState({w:360,h:600});
  const ref=useRef(null);
  useEffect(()=>{ const u=()=>{ if(ref.current){setDims({w:ref.current.offsetWidth});} }; u(); window.addEventListener("resize",u); return()=>window.removeEventListener("resize",u); },[]);
  useEffect(()=>{
    if(!fullscreen) return;
    const u=()=>setFsDims({w:Math.min(window.innerWidth-24,560),h:window.innerHeight-110});
    u(); window.addEventListener("resize",u); return()=>window.removeEventListener("resize",u);
  },[fullscreen]);

  // liveElapsed prop is updated every second by the parent via StudySession onTick

  const isFinished = s => s.seriesDone && !s.monthlyActive;
  const growing = subjects.filter(s=>!isFinished(s));
  const completed = subjects.filter(isFinished);

  const hts=[18,26,36,48,58,66];
  const lerp=(rot)=>{const r1=[249,115,22],r2=[101,67,33];return`rgb(${r1.map((v,i)=>Math.round(v+(r2[i]-v)*rot)).join(",")})`;};

  const layout = (gWval) => {
    const COLS=Math.max(3,Math.min(6,Math.ceil(Math.sqrt(growing.length*1.4))));
    const cellW=(gWval-40)/COLS;
    const rows=Math.ceil(growing.length/COLS);
    const gH=Math.max(420,100+rows*90+60);
    const positions=growing.map((s,i)=>{const col=i%COLS,row=Math.floor(i/COLS),jx=(Math.sin(s.id*7.3)*.28)*cellW,jy=(Math.cos(s.id*3.7)*.28)*40;return{x:20+col*cellW+cellW/2+jx,y:85+row*90+jy};});
    return { COLS, cellW, rows, gH, positions };
  };

  const drawCarrot=(s,pos,scale=1,isFs=false,sfx="n")=>{
    const overdue=Math.max(0,Math.floor((new Date()-new Date(s.nextReview))/86400000));
    const rot=Math.min(overdue/10,1);
    const h=hts[Math.min(s.stage,5)]*scale; const bw=(10+Math.min(s.stage,5)*2)*scale;
    const {x,y}=pos;
    const lc=rot>.6?`rgba(101,120,40,${1-rot*.7})`:rot>.3?"#7ea82a":"#16a34a";
    const path=carrotPath(bw,h);

    return (
      <g key={s.id} transform={`translate(${x},${y})`} onClick={(e)=>{e.stopPropagation();setTooltip(tooltip?.id===s.id?null:{...s,x,y,rot,overdue});}} style={{cursor:"pointer"}}>
        <g transform={rot>.4?"rotate(15,0,0)":""}>
          {[-50,-22,0,22,50].map((ang,li)=>{
            const len=((li===2?16:13)+Math.min(s.stage,5)*1.6)*scale;
            const rad=ang*Math.PI/180;
            const tipx=Math.sin(rad)*len*0.55, tipy=-h-4-Math.cos(rad)*len;
            return <path key={li} d={`M0,${-h-2} Q${tipx*0.4},${-h-2-len*0.5} ${tipx},${tipy} Q${tipx*0.6},${-h-2-len*0.3} 0,${-h-2}`} fill={lc} opacity={0.95}/>;
          })}
        </g>
        <path d={path} fill={`url(#cb_${sfx})`}/>
        <path d={path} fill={`url(#cbf_${sfx})`} opacity={rot}/>
        {[0.25,0.45,0.65,0.82].map((tt,ri)=>{const yy=-h+h*tt*0.92; const ww=(bw/2)*(1-tt*0.75); return <path key={ri} d={`M${-ww},${yy} Q0,${yy+3*scale} ${ww},${yy}`} stroke="rgba(120,50,10,0.35)" strokeWidth={1*scale} fill="none"/>;})}
        <ellipse cx={-bw*0.18} cy={-h*0.6} rx={bw*0.12} ry={h*0.32} fill="rgba(255,255,255,0.3)"/>
        <ellipse cx="0" cy={3*scale} rx={bw/2+3*scale} ry={3.5*scale} fill="#3d2a18" opacity=".5"/>

        <rect x={-bw} y={-h-22*scale} width={bw*2} height={h+28*scale} fill="transparent"/>

    );
  };

  const drawBasket=(gWval,gHval,count,scale=1,sfx="n")=>{

        {[0.3,0.55,0.8].map((tt,wi)=><line key={wi} x1={(-26+tt*6)*scale} y1={-tt*22*scale} x2={(26-tt*6)*scale} y2={-tt*22*scale} stroke="#5c3d1e" strokeWidth={1*scale} opacity={0.6}/>)}

  };

  const renderScene = (gWval, gHval, posArr, scale, isFs, sfx) => {
    const rows = Math.ceil(growing.length/Math.max(3,Math.min(6,Math.ceil(Math.sqrt(growing.length*1.4)))));
    return (
      <svg width={gWval} height={gHval} style={{display:"block"}} onClick={()=>{ if(isFs){ setFullscreen(false); } else { setFullscreen(true); } setTooltip(null); setBasketOpen(false); }}>
        <defs>
          <linearGradient id={`sky_${sfx}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#0c1a0f"/><stop offset="100%" stopColor="#1a2e1a"/></linearGradient>
          <linearGradient id={`gnd_${sfx}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#3d6b35"/><stop offset="40%" stopColor="#2d4f28"/><stop offset="100%" stopColor="#1a2e1a"/></linearGradient>

          <linearGradient id={`cbf_${sfx}`} x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stopColor="#a3793f"/><stop offset="45%" stopColor="#7c5430"/><stop offset="100%" stopColor="#5c3d1e"/></linearGradient>
        </defs>
        <rect width={gWval} height={gHval} fill={`url(#sky_${sfx})`}/>
        <rect y={50} width={gWval} height={gHval-50} fill={`url(#gnd_${sfx})`}/>
        {[...Array(rows+2)].map((_,i)=><ellipse key={i} cx={gWval/2} cy={90+i*90} rx={gWval/2-10} ry={14} fill="#2a1f14" opacity=".35"/>)}
        {[...Array(18)].map((_,i)=><circle key={i} cx={(i*137.5)%gWval} cy={5+(i*31)%40} r={.8+Math.sin(i)*.5} fill="white" opacity={.3+Math.sin(i*2)*.25}/>)}
        <circle cx={gWval-55} cy={26} r={13} fill="#fef3c7" opacity=".8"/>
        <circle cx={gWval-49} cy={22} r={10} fill="#1a2e1a" opacity=".9"/>
        {[...Array(24)].map((_,i)=><line key={i} x1={8+(i*(gWval/24))} y1={52} x2={6+(i*(gWval/24))+Math.sin(i)*4} y2={36+Math.sin(i*1.3)*4} stroke="#4a7c40" strokeWidth="2" strokeLinecap="round" opacity=".7"/>)}
        {[...Array(Math.floor(gWval/28)+1)].map((_,i)=><g key={i} transform={`translate(${i*28+4},0)`}><rect x="0" y="42" width="5" height="20" rx="1" fill="#5c3d1e" opacity=".7"/><polygon points="2.5,36 -1,42 6,42" fill="#6b4a26" opacity=".7"/></g>)}
        {[...Array(Math.floor(gWval/28))].map((_,i)=><rect key={i} x={i*28+4} y="48" width="28" height="3" rx="1" fill="#5c3d1e" opacity=".6"/>)}
        {growing.map((s,i)=>drawCarrot(s,posArr[i],scale,isFs,sfx))}
        {drawBasket(gWval,gHval,completed.length,scale,sfx)}
      </svg>
    );
  };

  const { gH, positions } = layout(dims.w-24);
  const gW = dims.w-24;
  const fsW = fsDims.w, fsH = fsDims.h;
  const fsLayout = layout(fsW);
  const fsScale = Math.min(1.6, Math.max(1, fsW/gW));

  const fmtDur = (secs) => { if(!secs) return "0m"; const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60); return h>0?`${h}h ${m}m`:`${m}m`; };
  const tooltipBox = (tt, boundW, boundH) => (
    <div style={{position:"absolute",left:Math.min(tt.x-10,boundW-190),top:Math.max(tt.y-hts[Math.min(tt.stage,5)]-80,10),background:"#1c1917",border:`2px solid ${tagColor(tt.tag)}`,borderRadius:14,padding:"10px 14px",minWidth:160,boxShadow:"0 8px 24px rgba(0,0,0,.6)",animation:"fadeIn .15s ease",zIndex:10,pointerEvents:"none"}}>
      <div style={{fontFamily:"'Baloo 2',cursive",fontWeight:800,fontSize:14,color:"#fef3c7",marginBottom:3}}>{tt.name}</div>
      <div style={{fontSize:11,color:tagColor(tt.tag),marginBottom:6}}>{tt.tag}</div>
      <CarrotBar stage={tt.stage}/>
      <div style={{marginTop:6,fontSize:11,color:isDue(tt)?"#fbbf24":"#57534e",fontFamily:"'Baloo 2',cursive"}}>{isDue(tt)?`⏰ ${tt.overdue>0?tt.overdue+"d overdue":"today"}`:`🗓 ${Math.ceil((new Date(tt.nextReview)-new Date())/86400000)}d`}</div>
      <div style={{marginTop:4,display:"flex",gap:10,fontSize:11,color:"#78716c",fontFamily:"'Baloo 2',cursive"}}>
        <span>🕐 {fmtDur(tt.totalTime)}</span>
        <span>📚 {tt.sessions} {tt.sessions===1?"session":"sessions"}</span>
      </div>
      {isDue(tt)&&<button onClick={()=>{setTooltip(null);setFullscreen(false);onStudy(tt);}} style={{marginTop:8,width:"100%",padding:"6px",background:"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",borderRadius:8,color:"#1c1917",fontFamily:"'Baloo 2',cursive",fontWeight:800,fontSize:12,cursor:"pointer",pointerEvents:"all"}}>{t.studyNow}</button>}
    </div>
  );

  const basketBox = () => (
    <div style={{position:"absolute",right:10,bottom:46,background:"#1c1917",border:"2px solid #f59e0b55",borderRadius:14,padding:"10px 14px",minWidth:170,maxWidth:230,boxShadow:"0 8px 24px rgba(0,0,0,.6)",animation:"fadeIn .15s ease",zIndex:10}}>
      <div style={{fontFamily:"'Baloo 2',cursive",fontWeight:800,fontSize:13,color:"#fbbf24",marginBottom:6}}>🧺 Harvested ({completed.length})</div>
      <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:140,overflowY:"auto"}}>
        {completed.map(s=><div key={s.id} style={{fontSize:12,color:"#a8a29e"}}>🥕 {s.name}</div>)}

            {tooltip&&tooltipBox(tooltip,fsW,fsLayout.gH)}

  );

// ── Auth Screen (Login / Register) ──────────────────────────────────────────────
const AuthScreen = ({ onLogin, t }) => {
  const [mode, setMode] = useState("login"); // login | register
  const [username, setUsernameInput] = useState("");
  const [password, setPasswordInput] = useState("");
  const [confirmPw, setConfirmPw] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const inp = {width:"100%",background:"#1c1917",border:"2px solid #44403c",borderRadius:12,padding:"13px 14px",color:"#fef3c7",fontFamily:"'Baloo 2',cursive",fontSize:15,outline:"none",transition:"border-color .2s"};

  const submit = async () => {
    setError("");
    const uname = username.trim();
    if (uname.length < 3) { setError(t.usernameMin); return; }
    if (password.length < 4) { setError(t.passwordMin); return; }
    setLoading(true);
    try {
      if (mode === "register") {
        if (password !== confirmPw) { setError(t.registerError); setLoading(false); return; }
        const existing = await stor.get("user_" + uname);
        if (existing) { setError(t.userExists); setLoading(false); return; }
        await stor.set("user_" + uname, { pw: hashPass(password) });
        await stor.set("loopy_session", { username: uname });
        onLogin(uname);
      } else {
        const user = await stor.get("user_" + uname);
        if (!user) { setError(t.noAccountFound || t.loginError); setLoading(false); return; }
        if (user.pw !== hashPass(password)) { setError(t.loginError); setLoading(false); return; }
        await stor.set("loopy_session", { username: uname });
        onLogin(uname);
      }
    } catch (e) {
      setError(t.loginError);
    }
    setLoading(false);
  };

  return (
    <div style={{minHeight:"100vh",minHeight:"100dvh",background:"#0c0a09",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px",animation:"fadeInUp .4s ease"}}>
      <div style={{width:"100%",maxWidth:340}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{fontSize:48,marginBottom:8}}>🐰</div>
          <div style={{fontFamily:"'Baloo 2',cursive",fontWeight:800,fontSize:20,color:"#fbbf24"}}>
            {mode === "login" ? t.loginTitle : t.registerTitle}
          </div>
          <div style={{fontFamily:"'Baloo 2',cursive",fontSize:13,color:"#78716c",marginTop:4}}>
            {mode === "login" ? t.loginSub : t.registerSub}
          </div>
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:14}}>
          <input
            value={username}
            onChange={e=>setUsernameInput(e.target.value)}
            placeholder={t.username}
            autoCapitalize="none"
            style={inp}
            onFocus={e=>e.target.style.borderColor="#f59e0b"}
            onBlur={e=>e.target.style.borderColor="#44403c"}
          />
          <input
            type="password"
            value={password}
            onChange={e=>setPasswordInput(e.target.value)}
            placeholder={t.password}
            onKeyDown={e=>{if(e.key==="Enter" && mode==="login") submit();}}
            style={inp}
            onFocus={e=>e.target.style.borderColor="#f59e0b"}
            onBlur={e=>e.target.style.borderColor="#44403c"}
          />
          {mode === "register" && (
            <input
              type="password"
              value={confirmPw}
              onChange={e=>setConfirmPw(e.target.value)}
              placeholder={t.confirmPw}
              onKeyDown={e=>{if(e.key==="Enter") submit();}}
              style={inp}
              onFocus={e=>e.target.style.borderColor="#f59e0b"}
              onBlur={e=>e.target.style.borderColor="#44403c"}
            />
          )}
        </div>

        {error && (
          <div style={{color:"#c4867a",fontSize:12,fontFamily:"'Baloo 2',cursive",marginBottom:14,textAlign:"center"}}>{error}</div>
        )}

        <button
          onClick={submit}
          disabled={loading}
          style={{width:"100%",padding:"14px",background:loading?"#292524":"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",borderRadius:14,color:loading?"#57534e":"#1c1917",fontFamily:"'Baloo 2',cursive",fontSize:16,fontWeight:800,cursor:loading?"default":"pointer",marginBottom:16}}
        >
          {loading ? "…" : (mode === "login" ? t.signIn : t.createAccount)}
        </button>

        <div style={{textAlign:"center",fontSize:13,fontFamily:"'Baloo 2',cursive",color:"#78716c"}}>
          {mode === "login" ? t.noAccount : t.hasAccount}{" "}
          <span
            onClick={()=>{setMode(mode==="login"?"register":"login"); setError(""); setConfirmPw("");}}
            style={{color:"#f59e0b",fontWeight:700,cursor:"pointer"}}
          >
            {mode === "login" ? t.register : t.signIn}
          </span>
        </div>
      </div>
    </div>
  );
};

// ── Main App ──────────────────────────────────────────────────────────────────
function LoopyStudy() {
  const [screen, setScreen] = useState("splash"); // splash | auth | app
  const [username, setUsername] = useState(null);
  const [subjects,setSubjectsRaw]=useState([]);
  const [studying,setStudying]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [tab,setTab]=useState("today");
  const [toast,setToast]=useState(null);
  const [motivToast,setMotivToast]=useState(null);
  const [profile,setProfileRaw]=useState({name:"Loopy Learner",avatarColor:"#f59e0b",streak:0});
  const [lang,setLangRaw]=useState("en");
  const [focusMode,setFocusMode]=useState(false);
  const [studyMinimized, setStudyMinimized] = useState(false);
  const [resumePrompt, setResumePrompt] = useState(null);
  const [eyeComfort, setEyeComfortRaw] = useState(false);
  const [eyeWarmth, setEyeWarmthRaw] = useState(40); // 20–70 opacity %
  const [completionModal, setCompletionModal] = useState(null); // subject that just finished its full review series
  const [notifs, setNotifsRaw] = useState(true); // kullanıcı bazında localStorage'a kaydedilir
  const [liveElapsed, setLiveElapsed] = useState(0); // current session timer, fed from StudySession via onTick

  const t = useT(lang);

  // On mount: check for active session, then check for abandoned timer
  useEffect(() => {
    const tid = setTimeout(async () => {
      try {
        const session = await stor.get("loopy_session");
        if (session && session.username) {
          await loadUserData(session.username);
          setUsername(session.username);
          setScreen("app");
          // Check for any abandoned study timers
          try {
            const _tks=_ls?Object.keys(localStorage).filter(k=>k.startsWith("loopy_timer_")):Object.keys(_mem).filter(k=>k.startsWith("loopy_timer_"));
            const keys={keys:_tks};
            if (keys && keys.keys && keys.keys.length > 0) {
              const key = keys.keys[0];
              const _st4=_ls?localStorage.getItem(key):(_mem[key]||null);const saved=_st4?{value:_st4}:null;
              if(saved){
                const {startedAt,base}=JSON.parse(saved.value);
                const elapsed = base + Math.floor((Date.now()-startedAt)/1000);
                const subId = parseInt(key.replace("loopy_timer_",""));
                setResumePrompt({key, subId, elapsed});
              }
            }
          } catch {}
        }
      } catch {}
    }, 100);
    return () => clearTimeout(tid);
  }, []);

  const loadUserData = async (uname) => {
    try {
      const s = await stor.get(`subj_${uname}`);
      if (s) setSubjectsRaw(s.map(x => ({...x, nextReview: new Date(x.nextReview)})));
      const p = await stor.get(`prof_${uname}`);
      if (p) setProfileRaw(p);
      const l = await stor.get(`lang_${uname}`);
      if (l) setLangRaw(l);
      const ec = await stor.get(`eye_${uname}`);
      if (ec) { setEyeComfortRaw(ec.on); setEyeWarmthRaw(ec.warmth ?? 40); }
      const nf = await stor.get(`notifs_${uname}`);
      if (nf !== null && nf !== undefined) setNotifsRaw(nf);
    } catch {}
  };

  // usernameRef ensures saves always use the current username even inside stale closures
  const usernameRef = useRef(null);
  useEffect(() => { usernameRef.current = username; }, [username]);

  const setSubjects = (u) => {
    setSubjectsRaw(prev => {
      const next = typeof u === "function" ? u(prev) : u;
      const uname = usernameRef.current;
      if (uname) stor.set("subj_" + uname, next);
      return next;
    });
  };

  const setProfile = (v) => { setProfileRaw(v); const uname=usernameRef.current; if(uname) stor.set("prof_"+uname, v); };
  const setLang = (l) => { setLangRaw(l); const uname=usernameRef.current; if(uname) stor.set("lang_"+uname, l); };
  const setEyeComfort = (v) => { setEyeComfortRaw(v); if(usernameRef.current) stor.set('eye_'+usernameRef.current, {on:v, warmth:eyeWarmth}); };
  const setEyeWarmth  = (v) => { setEyeWarmthRaw(v);  if(usernameRef.current) stor.set('eye_'+usernameRef.current, {on:eyeComfort, warmth:v}); };
  const setNotifs = (v) => { setNotifsRaw(v); if(usernameRef.current) stor.set('notifs_'+usernameRef.current, v); };

  const handleLogin = async (uname) => {
    usernameRef.current = uname;
    setUsername(uname);
    await loadUserData(uname);
    setScreen("app");
  };

  const handleLogout = async () => {
    await stor.set("loopy_session", null);
    setUsername(null);
    setSubjectsRaw([]);
    setProfileRaw({name:"Loopy Learner",avatarColor:"#f59e0b",streak:0});
    setNotifsRaw(true); // logout'ta varsayılana döner, yeni kullanıcı kendi ayarını getirir
    setTab("today");
    setScreen("auth");
  };

  // Notifications: request permission once on login (sadece notifs açıksa)
  useEffect(() => {
    if (screen !== "app" || !notifs) return;
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }
  }, [screen, notifs]);

  // Check for due subjects every 5 min and fire notification if app is in background
  // notifs kapalıysa interval hiç kurulmaz, cleanup otomatik iptal eder
  useEffect(() => {
    if (screen !== "app" || !notifs) return;
    const check = () => {
      const due = subjects.filter(isDue);
      if (due.length > 0 && document.hidden) {
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification("🥕 Loopy Study", {
            body: `${due.length} subject${due.length>1?"s":""} ready for review!`,
            icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%90%B0%3C/text%3E%3C/svg%3E"
          });
        }
      }
    };
    const id = setInterval(check, 5 * 60 * 1000);
    return () => clearInterval(id);
  }, [screen, subjects, notifs]);

  // Motivational toasts
  useEffect(() => {
    if (screen !== "app") return;
    const show = () => { setMotivToast(t.motiv[Math.floor(Math.random()*t.motiv.length)]); setTimeout(()=>setMotivToast(null),4500); };
    const first = setTimeout(show, 30000);
    const id = setInterval(show, 180000 + Math.random()*60000);
    return () => { clearTimeout(first); clearInterval(id); };
  }, [screen, lang]);

  const totalCarrots = subjects.reduce((a,s)=>a+s.stage,0);
  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null),3500); };
  const addSubject = (s) => { setSubjects(p=>[s,...p]); showToast(`🌱 "${s.name}" planted!`); };
  const deleteSubject = (id) => setSubjects(p=>p.filter(s=>s.id!==id));
  const completeSession = (subjectId, elapsed) => {
    let ni = 1;
    let finished = null;
    setSubjects(p=>p.map(s=>{
      if (s.id !== subjectId) return s;

      // 5-month maintenance phase
      if (s.monthlyActive) {
        const mc = s.monthlyCount + 1;
        if (mc >= 5) {
          ni = 0;
          return { ...s, monthlyActive:false, monthlyCount:mc, nextReview:FAR_FUTURE(), totalTime:s.totalTime+elapsed, sessions:s.sessions+1 };
        }
        ni = 30;
        return { ...s, monthlyCount:mc, nextReview:addDays(todayMidnight(),30), totalTime:s.totalTime+elapsed, sessions:s.sessions+1 };
      }

      // Completing the final stage (30-day review) → series done
      if (s.stage === INTERVALS.length - 1 && !s.seriesDone) {
        finished = { ...s, stage:INTERVALS.length, seriesDone:true, nextReview:FAR_FUTURE(), totalTime:s.totalTime+elapsed, sessions:s.sessions+1 };
        return finished;
      }

      // Normal: advance stage, pick next interval
      const ns = Math.min(s.stage + 1, INTERVALS.length - 1);
      ni = INTERVALS[ns];
      return { ...s, stage:ns, nextReview:addDays(todayMidnight(),ni), totalTime:s.totalTime+elapsed, sessions:s.sessions+1 };
    }));
    setStudying(null);
    // Streak güncelle — sadece tamamlanan review sayılır, uygulama açmak sayılmaz
    (() => {
      const today = localDateStr();
      const last  = profile.lastStudyDate;
      const newStreak = last === today
        ? (profile.streak || 1)              // bugün zaten çalışıldı → değişmez
        : last === localYesterdayStr()
          ? (profile.streak || 0) + 1        // dün çalışıldı → seri devam
          : 1;                               // gün atlandı ya da ilk kez → sıfırdan başla
      setProfile({ ...profile, streak: newStreak, lastStudyDate: today });
    })();
    if (finished) {
      setCompletionModal(finished);
    } else if (ni > 0) {
      showToast(`🥕 Next review in ${ni} ${t.days}!`);
    } else {
      showToast(`🏆 5-month review series complete!`);
    }
  };

  const acceptMonthlyRepeat = (subjectId, accept) => {
    if (accept) {
      setSubjects(p => p.map(s => s.id === subjectId
        ? { ...s, monthlyActive:true, monthlyCount:0, nextReview:addDays(todayMidnight(),30) }
        : s
      ));
    }
    setCompletionModal(null);
  };

  const STYLES = `
*{box-sizing:border-box;margin:0;padding:0;}
    body{background:#0c0a09;overflow-x:hidden;}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes splashIn{from{opacity:0;transform:translateY(30px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    @keyframes motivIn{from{opacity:0;transform:translateX(-50%) translateY(-16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    @keyframes twinkle{from{opacity:.15;transform:scale(1)}to{opacity:.7;transform:scale(1.5)}}
    @keyframes dotPulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    @keyframes pingPulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,.6)}70%{box-shadow:0 0 0 8px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
    input::placeholder,textarea::placeholder{color:#44403c}
    input,textarea{caret-color:#f59e0b}
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:#0c0a09}::-webkit-scrollbar-thumb{background:#44403c;border-radius:2px}
  `;

  // Inject head tags once
  useEffect(() => {
    document.title = "Loopy Study 🐰";
    if (!document.querySelector('link[data-loopy]')) {
      const lk = document.createElement('link');
      lk.rel='icon'; lk.setAttribute('data-loopy','1');
      lk.href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%90%B0%3C/text%3E%3C/svg%3E";
      document.head.appendChild(lk);
    }
  }, []);

  // Screens
  if (screen === "splash") return (<><style>{STYLES}</style><SplashScreen onDone={()=>setScreen(s=>s==="splash"?"auth":s)} t={t}/></>);
  if (screen === "auth") return (<><style>{STYLES}</style><AuthScreen onLogin={handleLogin} t={t}/></>);

  const handleMinimizeStudy = () => setStudyMinimized(true);
  const handleReturnToStudy = () => setStudyMinimized(false);
  const handleStartStudy = (sub) => { setStudying(sub); setStudyMinimized(false); };

  const TABS=[{id:"today",icon:"🏡",label:t.today},{id:"subjects",icon:"📖",label:t.subjects},{id:"garden",icon:"🌱",label:t.garden},{id:"account",icon:"🐰",label:t.account}];

  return (
    <>
      <style>{STYLES}</style>

      {/* ── Study session: always mounted when active, shown/hidden via z-index ── */}
      {studying && (
        <div style={{
          position:"fixed", inset:0, zIndex: studyMinimized ? -1 : 100,
          opacity: studyMinimized ? 0 : 1,
          pointerEvents: studyMinimized ? "none" : "auto",
          transition:"opacity .2s"
        }}>
          <StudySession
            subject={studying}
            onComplete={e=>{ completeSession(studying.id,e); setStudyMinimized(false); setLiveElapsed(0); }}
            onCancel={()=>{ setStudying(null); setStudyMinimized(false); setLiveElapsed(0); }}
            onMinimize={handleMinimizeStudy}
            onTick={setLiveElapsed}
            t={t}
          />
        </div>
      )}

      <HoppingRabbit/>
      {completionModal && <CompletionModal subject={completionModal} onChoice={(yes)=>acceptMonthlyRepeat(completionModal.id, yes)}/>}
      <div style={{minHeight:"100vh",background:"#0c0a09",color:"#fef3c7",fontFamily:"'Baloo 2',cursive",maxWidth:"var(--app-w,100%)",margin:"0 auto",paddingBottom:90}}>
        {/* Header */}
        <div style={{padding:"16px 20px 12px",background:"linear-gradient(180deg,#1c1917 0%,transparent 100%)",position:"sticky",top:0,zIndex:20}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:9}}>
              <div style={{width:34,height:34,borderRadius:10,background:"linear-gradient(135deg,#f59e0b,#d97706)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0,boxShadow:"0 2px 8px rgba(245,158,11,.4)"}}>🐰</div>
              <div><div style={{fontWeight:800,fontSize:20,color:"#fbbf24",lineHeight:1}}>{t.app}</div><div style={{fontSize:11,color:"#57534e",marginTop:1}}>{t.appSub}</div></div>
            </div>
            <div style={{textAlign:"center"}}>
              <div style={{fontWeight:800,fontSize:20,color:"#f97316"}}>🥕 {totalCarrots}</div>
              <div style={{fontSize:9,color:"#57534e"}}>{t.carrots}</div>
            </div>
          </div>

          {/* 🟢 Live session pill — visible on every tab while studying */}
          {studying && studyMinimized && (
            <LiveTimerPill subject={studying} onReturn={handleReturnToStudy}/>
          )}

          {/* Due subjects banner (only when not in a session) */}
          {!studying && subjects.filter(isDue).length>0 && (
            <div style={{marginTop:10,padding:"8px 14px",background:"rgba(245,158,11,.12)",border:"1px solid rgba(245,158,11,.3)",borderRadius:10,display:"flex",alignItems:"center",gap:8,animation:"pulse 2s infinite"}}>
              <span style={{fontSize:14}}>⏰</span>
              <span style={{fontSize:12,fontWeight:700,color:"#fbbf24",fontFamily:"'Baloo 2',cursive"}}>{subjects.filter(isDue).length} {t.dueToday}</span>
              <button onClick={()=>setTab("today")} style={{marginLeft:"auto",background:"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",borderRadius:8,padding:"4px 12px",color:"#1c1917",fontFamily:"'Baloo 2',cursive",fontWeight:800,fontSize:11,cursor:"pointer"}}>Review</button>
            </div>
          )}
        </div>

        {/* Resume-from-closed-tab banner */}
        {resumePrompt && (() => {
          const sub = subjects.find(s=>s.id===resumePrompt.subId);
          if(!sub) return null;
          const mins = Math.floor(resumePrompt.elapsed/60);
          const secs = resumePrompt.elapsed%60;
          return (
            <div style={{margin:"0 20px 12px",padding:"12px 16px",background:"linear-gradient(135deg,rgba(59,130,246,.15),rgba(37,99,235,.08))",border:"2px solid rgba(59,130,246,.35)",borderRadius:16,display:"flex",alignItems:"center",gap:12,animation:"fadeIn .3s ease"}}>
              <div style={{fontSize:24}}>⏱</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:"'Baloo 2',cursive",fontWeight:800,fontSize:14,color:"#93c5fd"}}>Session in progress</div>
                <div style={{fontSize:12,color:"#57534e",marginTop:1}}>{sub.name} · {String(mins).padStart(2,"0")}:{String(secs).padStart(2,"0")} elapsed</div>
              </div>
              <button onClick={()=>{handleStartStudy(sub);setResumePrompt(null);}} style={{padding:"7px 14px",background:"linear-gradient(135deg,#3b82f6,#2563eb)",border:"none",borderRadius:10,color:"white",fontFamily:"'Baloo 2',cursive",fontWeight:800,fontSize:13,cursor:"pointer"}}>Resume</button>
              <button onClick={async()=>{_ls?localStorage.removeItem(resumePrompt.key):(delete _mem[resumePrompt.key]);setResumePrompt(null);}} style={{background:"none",border:"none",color:"#44403c",fontSize:18,cursor:"pointer",padding:"0 2px"}}>×</button>
            </div>
          );
        })()}

        {tab==="today"    && <TodayTab    subjects={subjects} onStudy={handleStartStudy} onDelete={deleteSubject} t={t}/>}
        {tab==="subjects" && <SubjectsTab subjects={subjects} onStudy={handleStartStudy} onDelete={deleteSubject} t={t}/>}
        {tab==="garden"   && <GardenTab   subjects={subjects} onStudy={handleStartStudy} studying={studying} liveElapsed={liveElapsed} t={t}/>}
        {tab==="account"  && <AccountTab  subjects={subjects} profile={profile} onUpdateProfile={setProfile} lang={lang} setLang={setLang} focusMode={focusMode} setFocusMode={setFocusMode} eyeComfort={eyeComfort} setEyeComfort={setEyeComfort} eyeWarmth={eyeWarmth} setEyeWarmth={setEyeWarmth} notifs={notifs} setNotifs={setNotifs} onLogout={handleLogout} username={username} t={t}/>}

        {/* FAB */}
        {tab!=="account"&&<button onClick={()=>setShowAdd(true)} style={{position:"fixed",bottom:78,right:"max(20px,calc(50% - var(--app-half,50%) + 20px))",width:54,height:54,background:"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",borderRadius:"50%",fontSize:28,cursor:"pointer",zIndex:25,boxShadow:"0 4px 20px rgba(245,158,11,.5)",display:"flex",alignItems:"center",justifyContent:"center",transition:"transform .15s"}} onMouseEnter={e=>e.currentTarget.style.transform="scale(1.12) rotate(12deg)"} onMouseLeave={e=>e.currentTarget.style.transform="none"}>＋</button>}

        {/* Bottom nav */}
        <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:"var(--app-w,100%)",background:"#1c1917",borderTop:"1px solid #292524",display:"flex",padding:"8px 0 14px",zIndex:20}}>
          {TABS.map(tx=><button key={tx.id} onClick={()=>setTab(tx.id)} style={{flex:1,background:"transparent",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"5px 0"}}><div style={{fontSize:20}}>{tx.icon}</div><div style={{fontSize:10,fontWeight:700,color:tab===tx.id?"#fbbf24":"#44403c"}}>{tx.label}</div>{tab===tx.id&&<div style={{width:18,height:2,background:"#f59e0b",borderRadius:1}}/>}</button>)}
        </div>

        {focusMode&&<FocusOverlay onExit={()=>setFocusMode(false)} t={t}/>}
        {/* Eye comfort warm overlay */}
        {eyeComfort&&<div style={{position:"fixed",inset:0,background:`rgba(255,160,60,${eyeWarmth/100*0.55})`,pointerEvents:"none",zIndex:9998,mixBlendMode:"soft-light",borderRadius:0}}/>}
        {motivToast&&<div style={{position:"fixed",top:80,left:"50%",transform:"translateX(-50%)",background:"linear-gradient(135deg,#1c1917,#292524)",border:"1px solid #f59e0b44",borderRadius:14,padding:"12px 20px",fontFamily:"'Baloo 2',cursive",fontSize:13,fontWeight:700,color:"#fbbf24",whiteSpace:"nowrap",zIndex:61,animation:"motivIn .3s cubic-bezier(.34,1.56,.64,1)",boxShadow:"0 8px 24px rgba(0,0,0,.5)",maxWidth:"90vw",textAlign:"center"}}>🌱 {motivToast}</div>}
        {showAdd&&<AddModal onAdd={addSubject} onClose={()=>setShowAdd(false)} existingTags={[...new Set(subjects.map(s=>s.tag))].filter(Boolean)} t={t}/>}
        {toast&&<div style={{position:"fixed",bottom:100,left:"50%",transform:"translateX(-50%)",background:"#292524",border:"1px solid #44403c44",borderRadius:12,padding:"10px 20px",fontFamily:"'Baloo 2',cursive",fontSize:13,color:"#fef3c7",whiteSpace:"nowrap",zIndex:60,animation:"toastIn .3s cubic-bezier(.34,1.56,.64,1)",boxShadow:"0 8px 24px rgba(0,0,0,.5)"}}>{toast}</div>}
      </div>
    </>
  );
}


const _root=ReactDOM.createRoot(document.getElementById('root'));
_root.render(React.createElement(LoopyStudy));
  </script>
</body>
</html>
